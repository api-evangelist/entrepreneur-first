name: Entrepreneur First
description: 'Entrepreneur First (EF) is a talent investor that backs exceptional individuals before
  they have a company, pairing them into cofounding teams and providing pre-seed capital, mentorship,
  and a global network to build technology startups from scratch. Founded in London in 2011 by Matt
  Clifford and Alice Bentinck, EF runs cohort-based programs across Europe, Asia, and North America and
  has helped launch hundreds of venture-backed companies. It was surfaced as a portfolio company of
  Greylock and added to the API Evangelist network; EF publishes no public developer API surface.'
